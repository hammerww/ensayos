    const elQId = document.getElementById("qId");
    const elQText = document.getElementById("qText");
    const elOptions = document.getElementById("options");
    const elMultiBadge = document.getElementById("multiBadge");
    const elFeedback = document.getElementById("feedback");
    const elExplanation = document.getElementById("explanation");
    const btnPrev = document.getElementById("prevBtn");
    const btnNext = document.getElementById("nextBtn");
    const btnCheck = document.getElementById("checkBtn");

    function renderQuestion() {
      const q = questions[current];
      const correctIdx = getCorrectIndexes(q);
      const isMulti = correctIdx.length > 1;

      elCurrentIdx.textContent = current + 1;
      elTotalQ.textContent = questions.length;
      elQId.textContent = q.id || "";
      elQText.textContent = q.question || "";
      elFeedback.textContent = "";
      elFeedback.className = "feedback";
      elExplanation.textContent = "";

      elMultiBadge.style.display = isMulti ? "block" : "none";

      elOptions.innerHTML = "";
      const inputType = isMulti ? "checkbox" : "radio";

      (q.options || []).forEach((opt, idx) => {
        const wrapper = document.createElement("label");
        wrapper.className = "option";
        wrapper.dataset.index = idx;

        const input = document.createElement("input");
        input.type = inputType;
        input.name = "option";
        input.className = "opt-input";

        const span = document.createElement("div");
        span.className = "option-label";
        span.textContent = opt;

        wrapper.appendChild(input);
        wrapper.appendChild(span);
        elOptions.appendChild(wrapper);
      });

      // botonera
      btnPrev.disabled = current === 0;
      btnNext.disabled = current === questions.length - 1;
    }

    function getSelectedIndexes() {
      const nodes = elOptions.querySelectorAll(".opt-input");
      const selected = [];
      nodes.forEach((input, idx) => {
        if (input.checked) selected.push(idx);
      });
      return selected.sort();
    }

    function arraysEqual(a, b) {
      if (a.length !== b.length) return false;
      for (let i = 0; i < a.length; i++) {
        if (a[i] !== b[i]) return false;
      }
      return true;
    }

    function checkAnswer() {
      const q = questions[current];
      const correctIdx = getCorrectIndexes(q);
      const selected = getSelectedIndexes();

      // limpiar estilos
      elOptions.querySelectorAll(".option").forEach(el => {
        el.classList.remove("correct", "incorrect");
      });

      if (selected.length === 0) {
        elFeedback.textContent = "Selecciona al menos una opción antes de validar.";
        elFeedback.className = "feedback bad";
        return;
      }

      const ok = arraysEqual(selected, correctIdx);

      // marcar correctas/incorrectas visualmente
      elOptions.querySelectorAll(".option").forEach(el => {
        const idx = Number(el.dataset.index);
        if (correctIdx.includes(idx)) {
          el.classList.add("correct");
        }
        if (selected.includes(idx) && !correctIdx.includes(idx)) {
          el.classList.add("incorrect");
        }
      });

      if (ok) {
        elFeedback.textContent = "✅ ¡Respuesta correcta!";
        elFeedback.className = "feedback ok";
        if (!answeredCorrectly.has(current)) {
          answeredCorrectly.add(current);
          score++;
          elScore.textContent = score;
        }
      } else {
        elFeedback.textContent = "❌ Respuesta incorrecta. Revisa las opciones marcadas en verde.";
        elFeedback.className = "feedback bad";
      }

      if (q.explanation) {
        elExplanation.textContent = q.explanation;
      }
    }

    btnPrev.addEventListener("click", () => {
      if (current > 0) {
        current--;
        renderQuestion();
      }
    });

    btnNext.addEventListener("click", () => {
      if (current < questions.length - 1) {
        current++;
        renderQuestion();
      }
    });

    btnCheck.addEventListener("click", checkAnswer);

    if (questions.length === 0) {
      elQText.textContent = "Pega tu JSON en la constante 'questions' dentro del script.";
      btnCheck.disabled = true;
      btnNext.disabled = true;
      btnPrev.disabled = true;
    } else {
      renderQuestion();
    }
  </script>
</body>
</html>
